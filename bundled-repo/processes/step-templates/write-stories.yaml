step_template:
  name: write-stories
  title: 拆解用户故事
  prompt: |
    阅读 docs/requirements/{process_name}-PRD.md，把功能清单拆分为可交付的用户故事列表。
    每个故事需包含：标题、As a / I want / So that、验收条件（Given/When/Then）。
    将结果追加或更新到 docs/requirements/{process_name}-stories.md。
  executor: claudecode
  expert_name: product-manager
  skills: [4p12s-stories]
  model: claude-sonnet-5
  acceptance_criteria: |
    docs/requirements/{process_name}-stories.md 存在且每个用户故事都有验收条件。
