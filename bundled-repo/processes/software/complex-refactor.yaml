process:
  name: complex-refactor
  display_name: 重构工艺
  description: |
    适合大型重构、强治理、规约驱动的项目：
    Constitution → Specify → Clarify → Plan → Checklist → Tasks → Analyze → Implement → Converge。
    每个阶段 1-2 个环节，产物完整，门禁严格。
  category: software
  complexity: complex
  version: 1.0.0
limits:
  max_step_executions: 100
  max_total_tokens: 500000
abnormal_handler:
  trigger_on: [capped_step, capped_token, failed]
phases:
  - id: constitution
    name: 宪章
    spec: |
      定义项目宪章：核心原则、架构约束、不可妥协的质量标准。
    acceptance_criteria: |
      宪章文档存在且包含原则、约束、质量标准三章。
    links:
      - id: c01
        name: 制定宪章
        prompt: |
          为当前项目编写宪章文档（constitution.md）。
          必须包含：
          1. 核心原则（3-5 条不可妥协的原则）
          2. 架构约束（技术栈、通信协议、部署方式）
          3. 质量标准（至少一个可量化的指标）
          输出到 docs/constitution.md。
        executor: atomcode
        expert_name: architect
        skills: []
        expected_artifacts:
          - name: constitution-doc
            type: file
            path: docs/constitution.md
        gates:
          - name: 宪章存在
            type: artifact_present
            artifact: constitution-doc
          - name: 人工确认宪章
            type: human_approval
        on_success: next
        on_gate_fail: goto:c01
        max_rework: 2

  - id: specify
    name: 规约
    spec: |
      基于宪章编写详细规约：领域模型、接口定义、数据流、事件流。
    acceptance_criteria: |
      规约文档存在且覆盖领域模型、接口、数据流、事件流。
    links:
      - id: sp01
        name: 编写规约
        prompt: |
          基于 docs/constitution.md，编写详细规约（specification.md）。
          必须覆盖：领域模型（实体+关系）、接口定义（至少 3 个 API）、
          数据流（主要数据路径）、事件流（异步事件）。
          输出到 docs/specification.md。
        executor: atomcode
        expert_name: architect
        skills: []
        expected_artifacts:
          - name: spec-doc
            type: file
            path: docs/specification.md
        gates:
          - name: 规约存在
            type: artifact_present
            artifact: spec-doc
        on_success: next
        on_gate_fail: goto:sp01
        max_rework: 3

  - id: clarify
    name: 澄清
    spec: |
      对规约中的模糊点逐条澄清，生成 FAQ / 决策记录。
    acceptance_criteria: |
      FAQ 文档存在，至少回答 5 个关键设计决策问题。
    links:
      - id: cl01
        name: 澄清与决策
        prompt: |
          阅读 docs/specification.md，识别至少 5 个模糊或需要决策的点。
          逐条记录决策与理由，输出到 docs/clarifications.md。
        executor: atomcode
        expert_name: architect
        skills: []
        expected_artifacts:
          - name: clarifications-doc
            type: file
            path: docs/clarifications.md
        gates:
          - name: 澄清文档存在
            type: artifact_present
            artifact: clarifications-doc
        on_success: next
        on_gate_fail: goto:cl01
        max_rework: 2

  - id: plan
    name: 计划
    spec: |
      制定实现计划：里程碑、任务拆分、依赖关系。
    acceptance_criteria: |
      计划文档存在，任务拆分为可独立验证的子任务。
    links:
      - id: pl01
        name: 制定计划
        prompt: |
          基于规约和澄清，制定实现计划。包括：里程碑（3-5 个）、
          每里程碑的任务列表、关键依赖关系、风险点。
          输出到 docs/implementation-plan.md。
        executor: atomcode
        expert_name: tech-lead
        skills: []
        expected_artifacts:
          - name: plan-doc
            type: file
            path: docs/implementation-plan.md
        gates:
          - name: 计划存在
            type: artifact_present
            artifact: plan-doc
        on_success: next
        on_gate_fail: goto:pl01
        max_rework: 2

  - id: checklist
    name: 检查单
    spec: |
      生成实现前检查单：验收标准逐条对应的验证方法。
    acceptance_criteria: |
      检查单覆盖每个 milestone 的验收条件。
    links:
      - id: ch01
        name: 生成检查单
        prompt: |
          为每个里程碑生成检查单。每项包含：检查内容、验证方法、
          通过标准。输出到 docs/checklist.md。
        executor: atomcode
        expert_name: tech-lead
        skills: []
        expected_artifacts:
          - name: checklist-doc
            type: file
            path: docs/checklist.md
        gates:
          - name: 检查单存在
            type: artifact_present
            artifact: checklist-doc
        on_success: next
        on_gate_fail: goto:ch01
        max_rework: 2

  - id: tasks
    name: 任务
    spec: |
      将计划细化为可执行的任务卡片，分配给执行者。
    acceptance_criteria: |
      任务列表存在，每个任务有明确的验收条件。
    links:
      - id: ts01
        name: 制定任务卡
        prompt: |
          将实现计划拆解为可执行的任务卡。每个任务包含：
          标题、验收条件、预估工时、依赖任务。
          输出到 docs/task-cards.md。
        executor: atomcode
        expert_name: tech-lead
        skills: []
        expected_artifacts:
          - name: task-cards
            type: file
            path: docs/task-cards.md
        gates:
          - name: 任务卡存在
            type: artifact_present
            artifact: task-cards
        on_success: next
        on_gate_fail: goto:ts01
        max_rework: 2

  - id: analyze
    name: 分析
    spec: |
      静态分析 + 架构评审，确保设计符合宪章原则。
    acceptance_criteria: |
      分析报告存在，无明显违反宪章的设计。
    links:
      - id: an01
        name: 架构分析
        prompt: |
          对照宪章（docs/constitution.md），审查当前设计。
          检查：是否违反核心原则、是否有架构约束冲突、
          质量标准是否可达到。
          输出到 docs/architecture-analysis.md。
        executor: atomcode
        expert_name: architect
        skills: []
        expected_artifacts:
          - name: analysis-doc
            type: file
            path: docs/architecture-analysis.md
        gates:
          - name: 分析报告存在
            type: artifact_present
            artifact: analysis-doc
          - name: 人工确认分析
            type: human_approval
        on_success: next
        on_gate_fail: goto:an01
        max_rework: 2

  - id: implement
    name: 实现
    spec: |
      按任务卡执行实现，每次变更需通过测试和审查。
    acceptance_criteria: |
      所有任务卡验收通过，测试全绿。
    links:
      - id: im01
        name: 实现与测试
        step_template: tdd-cycle
        expected_artifacts:
          - name: test-report
            type: file
            path: .ntd/test-report.md
        gates:
          - name: 测试报告存在
            type: artifact_present
            artifact: test-report
        on_success: next
        on_gate_fail: goto:im01
        max_rework: 5

  - id: converge
    name: 收敛
    spec: |
      最终审查、文档更新、交付确认。
    acceptance_criteria: |
      交付文档完整，回顾总结完成。
    links:
      - id: cv01
        name: 收敛审查
        prompt: |
          最终审查：
          1. 对照 docs/checklist.md 逐项确认
          2. 更新 docs/delivery-state.md
          3. 编写项目回顾总结到 docs/retrospective.md
        executor: atomcode
        expert_name: tech-lead
        skills: []
        expected_artifacts:
          - name: delivery-state
            type: file
            path: .ntd/delivery-state.md
          - name: retrospective
            type: file
            path: docs/retrospective.md
        gates:
          - name: 交付状态存在
            type: artifact_present
            artifact: delivery-state
        on_success: end
        on_gate_fail: goto:cv01
        max_rework: 3
